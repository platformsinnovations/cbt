; ============================================================================
; PHP Configuration for CBT Offline Bundled Server
; ============================================================================

; --- Core Settings ---
engine                   = On
short_open_tag           = Off
precision                = 14
output_buffering         = 4096
zlib.output_compression  = Off
implicit_flush           = Off
max_execution_time       = 120
max_input_time           = 120
memory_limit             = 256M
error_reporting          = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors           = Off
display_startup_errors   = Off
log_errors               = On
; error_log is set dynamically by launcher; default here:
error_log                = ../data/logs/php_errors.log
ignore_repeated_errors   = Off
report_memleaks          = On

; --- File Uploads ---
file_uploads             = On
upload_max_filesize      = 50M
post_max_size            = 52M
max_file_uploads         = 20

; --- Session ---
session.save_handler     = files
session.save_path        = "../data/sessions"
session.use_strict_mode  = 1
session.cookie_httponly  = 1
session.gc_maxlifetime   = 7200
session.name             = CBTSESSID

; --- Date ---
date.timezone            = Africa/Lagos

; --- Extensions (Windows DLLs in php/ext/) ---
extension_dir            = "ext"
extension                = mysqli
extension                = pdo_mysql
extension                = mbstring
extension                = openssl
extension                = curl
extension                = gd
extension                = fileinfo
extension                = zip
extension                = exif
; Sockets for IP detection
extension                = sockets

; --- MySQLi ---
mysqli.default_host      = 127.0.0.1
mysqli.default_port      = 3306

; --- Misc ---
realpath_cache_size      = 4096k
realpath_cache_ttl       = 120
