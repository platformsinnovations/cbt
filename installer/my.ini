# ============================================================================
# MariaDB Configuration for CBT Offline Bundled Server
# Portable install — no system-wide changes, no Windows service.
# ============================================================================

[mysqld]
# Bind ONLY to localhost — database is NOT exposed to the LAN
# (only the PHP server is exposed on port 8080)
bind-address            = 127.0.0.1
port                    = 3306

# Paths (use forward slashes or double backslashes)
# These are overridden at runtime by launcher.bat via --datadir flag
basedir                 = .
datadir                 = ../data/mariadb

# Character Set
character-set-server    = utf8mb4
collation-server        = utf8mb4_general_ci

# InnoDB Engine
default-storage-engine  = InnoDB
innodb_buffer_pool_size = 64M
innodb_file_per_table   = 1
innodb_flush_log_at_trx_commit = 2

# Performance for single-user offline use
max_connections         = 50
table_open_cache        = 64
query_cache_type        = 0
tmp_table_size          = 32M
max_heap_table_size     = 32M

# Logging
general_log             = 0
slow_query_log          = 0

# Skip unnecessary features
skip-name-resolve
skip-external-locking

[client]
port                    = 3306
default-character-set   = utf8mb4

[mysql]
default-character-set   = utf8mb4
